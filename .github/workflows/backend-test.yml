name: Backend Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: yarn install --no-lockfile --non-interactive

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        env:
          SUPABASE_URL: https://dummy-test.supabase.co
          SUPABASE_ANON_KEY: dummy-anon-key-for-test-suite
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-test-suite
          JWT_SECRET: dummy-jwt-secret-for-testing-only-12345
          NODE_ENV: test
        run: yarn test --runInBand
